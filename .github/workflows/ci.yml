name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      JWT_SECRET: ci-test-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Sem --fix: o CI recusa código que o autofix mudaria.
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npm run build
      - run: npm run test
      - run: npm run test:e2e

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Sem --fix: o CI recusa código que o autofix mudaria.
      - run: npx eslint .
      - run: npm run format:check
      - run: npm test
      # Prova que o Metro resolve tudo (mqtt, @noble/hashes…); não roda no aparelho.
      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"

  device:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('device/platformio.ini') }}
      - run: pip install platformio
      # Serialização do payload e simulador, no PC.
      - run: pio test -e native
      # Compila para a placa (não grava nem roda).
      - run: pio run -e esp32dev
