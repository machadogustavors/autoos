; Firmware do dispositivo AutoOS (ESP32 + MCP2515). Contrato: contract/mqtt-topics.md §1.
; Esta versão lê PIDs SIMULADOS — o MCP2515 ainda não está ligado (docs/PHASES.md, Fase 12).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DAUTOOS_SOURCE_SIMULATED=1
    -DCORE_DEBUG_LEVEL=0

; Testes no PC (sem placa): serialização do payload e simulador.
[env:native]
platform = native
test_framework = unity
; Compila src/ junto dos testes (senão reading.cpp e o simulador não linkam).
test_build_src = yes
build_flags =
    -std=gnu++17
    -DAUTOOS_NATIVE_TEST=1
; main.cpp depende de Arduino/NimBLE e só compila para a placa.
build_src_filter =
    +<*>
    -<main.cpp>
