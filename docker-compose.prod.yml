# Produção: API + Postgres + Nginx. Desenvolvimento usa docker-compose.yml
# (só os bancos) e a API roda no host.
#
#   cp api/.env.example api/.env     # preencha JWT_SECRET, GOOGLE_CLIENT_ID…
#   mkdir -p deploy/certs            # fullchain.pem + privkey.pem
#   POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up -d --build
#
# DATABASE_URL no api/.env deve apontar para o host `autoos-db`:
#   postgresql://autoos:<POSTGRES_PASSWORD>@autoos-db:5432/autoos

services:
  autoos-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: autoos
    volumes:
      - autoos_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoos -d autoos']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      PORT: '3000'
    depends_on:
      autoos-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/v1/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  autoos_prod_data:
