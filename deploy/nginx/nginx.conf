# Nginx na frente da API AutoOS (AGENTS.md: Docker + Nginx como proxy reverso).
# RNF-07: todo trânsito em TLS — a porta 80 só redireciona.
# Os certificados NÃO ficam no git: monte em deploy/certs/ (fullchain.pem e
# privkey.pem), por exemplo emitidos com Let's Encrypt.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # O body de uma OS/snapshot é pequeno; sem upload na V1 (RNF-13).
    client_max_body_size 256k;

    # /dev/login é ajuda de desenvolvimento (AGENTS.md), nunca em produção.
    location /dev/ {
        return 404;
    }

    location / {
        proxy_pass http://api:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
